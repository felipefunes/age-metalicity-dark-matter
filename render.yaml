# Render Blueprint (Infrastructure as Code) -- deploy via the Render
# dashboard: "New" -> "Blueprint" -> point at this repo. Both services run
# on the free plan; see README.md "Producción (Render)" for the real
# free-tier tradeoffs (API sleeps after 15 min idle, cold start on wake;
# no persistent disk, so every deploy re-runs the full pipeline to
# rebuild the data baked into the API image -- see api/Dockerfile.render).
services:
  - type: web
    name: age-metalicity-dark-matter-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: age-metalicity-dark-matter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Proxies /api/* to the API service's public URL so the browser
      # never makes a cross-origin request (same pattern as the nginx
      # config used for local docker-compose, frontend/nginx.conf).
      # Verified working in production after the first deploy.
      - type: rewrite
        source: /api/*
        destination: https://age-metalicity-dark-matter-api.onrender.com/*
      # SPA fallback: the frontend added client-side routing (/galaxies)
      # with a hand-rolled router, not a full page per route. Render's
      # static sites don't serve index.html for unknown paths by default
      # (unlike the nginx config used for docker-compose, which already had
      # `try_files $uri $uri/ /index.html`, and unlike Vite's dev/preview
      # servers, which SPA-fallback out of the box) -- without this rule, a
      # direct load or refresh of /galaxies in production 404s even though
      # client-side navigation to it works fine. Must come after the more
      # specific /api/* rule above so that one still matches first.
      - type: rewrite
        source: /*
        destination: /index.html
