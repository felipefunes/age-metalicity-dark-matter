server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static SPA: any non-file route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the API container so the browser only ever talks to
    # this origin (avoids CORS entirely in the docker-compose deployment).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
